
name: Build FLM BOOST APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="FLM_BOOST_Lag_Fix_v2_Source.zip"
          test -f "$ZIP" || {
            echo "::error::Missing $ZIP"
            exit 1
          }
          unzip -o "$ZIP" -d .
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    compileOptions {
                      sourceCompatibility = JavaVersion.VERSION_17
                      targetCompatibility = JavaVersion.VERSION_17
                  }
                  defaultConfig {""",
                  1
              )

          if "jvmTarget" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    kotlinOptions {
                      jvmTarget = "17"
                  }
                  defaultConfig {""",
                  1
              )

          p.write_text(s)
          print(s)
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            2>&1 | tee build.log

      - name: Prepare APK
        run: |
          mkdir -p output
          cp \
            app/build/outputs/apk/debug/app-debug.apk \
            output/FLM-BOOST-Lag-Fix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-Lag-Fix-APK
          path: output/FLM-BOOST-Lag-Fix.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FLM-BOOST-Build-Logs
          path: build.log
          if-no-files-found: ignore
